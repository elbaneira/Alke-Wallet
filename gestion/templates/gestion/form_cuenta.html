{% extends 'gestion/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Nueva Cuenta</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label mb-0">Cliente Titular</label>
                            <a href="{% url 'crear_cliente' %}" class="small text-decoration-none">+ Crear Nuevo Cliente</a>
                        </div>
                        <select name="cliente" class="form-select" required>
                            <option value="">-- Seleccionar Cliente --</option>
                            {% for c in clientes %}
                                <option value="{{ c.id }}">{{ c.nombre }} ({{ c.email }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Número de Cuenta</label>
                        <input type="text" name="numero_cuenta" class="form-control" placeholder="Ej: ACC-1002" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo de Cuenta</label>
                        <select name="tipo_cuenta" class="form-select" required>
                            <option value="VIRTUAL">Billetera Virtual</option>
                            <option value="CORRIENTE">Cuenta Corriente</option>
                            <option value="AHORRO">Cuenta de Ahorro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Saldo Inicial ($)</label>
                        <input type="number" step="0.01" name="saldo" class="form-control" value="0.00" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Crear Cuenta</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
