{% extends 'gestion/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0 fs-6 fw-bold">Registrar Nuevo Movimiento</h5>
            </div>
            <div class="card-body p-4">
                
                <form method="POST" action="{% url 'crear_transaccion' %}">
                    {% csrf_token %}

                    <!-- 1. Tipo de Transacción -->
                    <div class="mb-3">
                        <label for="tipo" class="form-label fw-bold">Tipo de Movimiento</label>
                        <select name="tipo" id="tipo" class="form-select" required>
                            <option value="TRANSFERENCIA" selected>Transferencia</option>
                            <option value="DEPOSITO">Depósito (Ingreso de dinero)</option>
                            <option value="RETIRO">Retiro (Giro de dinero)</option>
                        </select>
                    </div>

                    <!-- 2. Cuenta Origen (Cuentas propias del usuario logueado) -->
                    <div class="mb-3">
                        <label for="cuenta_origen" class="form-label fw-bold">Desde Cuenta (Origen)</label>
                        <select name="cuenta_origen" id="cuenta_origen" class="form-select" required>
                            {% for cuenta in cuentas_origen %}
                                <option value="{{ cuenta.id }}">
                                    {{ cuenta.numero_cuenta }} - {{ cuenta.get_tipo_cuenta_display }} (${{ cuenta.saldo }})
                                </option>
                            {% empty %}
                                <option value="">No tienes cuentas disponibles</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- 3. Cuenta Destino (Un único <select> ordenado por grupos) -->
                    <div class="mb-3" id="bloque_cuenta_destino">
                        <label for="cuenta_destino" class="form-label fw-bold">Hacia Cuenta (Destinatario)</label>
                        <select name="cuenta_destino" id="cuenta_destino" class="form-select">
                            <option value="">-- Selecciona el destinatario --</option>
                            
                            <!-- Grupo 1: Entre Mis Cuentas -->
                            <optgroup label="📌 Entre Mis Cuentas">
                                {% for cuenta in mis_cuentas %}
                                    <option value="{{ cuenta.id }}">
                                        {{ cuenta.numero_cuenta }} - {{ cuenta.get_tipo_cuenta_display }} (${{ cuenta.saldo }})
                                    </option>
                                {% endfor %}
                            </optgroup>

                            <!-- Grupo 2: Cuentas de otros usuarios -->
                            <optgroup label="👤 Cuentas de Terceros">
                                {% for cuenta in cuentas_terceros %}
                                    <option value="{{ cuenta.id }}">
                                        {{ cuenta.cliente.nombre }} — {{ cuenta.numero_cuenta }} ({{ cuenta.get_tipo_cuenta_display }})
                                    </option>
                                {% empty %}
                                    <option value="">No hay cuentas de otros usuarios</option>
                                {% endfor %}
                            </optgroup>
                        </select>
                    </div>

                    <!-- 4. Monto -->
                    <div class="mb-3">
                        <label for="monto" class="form-label fw-bold">Monto ($)</label>
                        <input type="number" step="0.01" min="1" name="monto" id="monto" class="form-control" placeholder="Ej: 15000" required>
                    </div>

                    <!-- 5. Descripción u observación -->
                    <div class="mb-4">
                        <label for="descripcion" class="form-label fw-bold">Descripción / Motivo (Opcional)</label>
                        <input type="text" name="descripcion" id="descripcion" class="form-control" placeholder="Ej: Pago de almuerzo">
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            Procesar Transacción
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
