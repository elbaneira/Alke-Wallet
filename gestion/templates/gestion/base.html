<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

        
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Alke Wallet</a>
    
        <div class="d-flex align-items-center ms-auto">
          {% if user.is_authenticated %}
          <!-- Si el usuario INICIÓ sesión -->
        <span class="text-light me-3">
          Hola, <strong>{{ user.username }}</strong>
        </span>
     </div>    
        <!-- Botón para Cerrar Sesión (Logout) por método POST -->
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}  <!-- <-- ESTA LÍNEA ES IMPRESCINDIBLE -->
            <button type="submit" class="btn btn-outline-light btn-sm">
                Cerrar Sesión
            </button>
            </form>
      {% else %}
        <!-- Si el usuario NO ha iniciado sesión -->
        <a href="{% url 'login' %}" class="btn btn-primary btn-sm">
          Iniciar Sesión
        </a>
      {% endif %}
  </div>
</nav>
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">💰 Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active fw-bold text-warning border-bottom border-warning{% endif %}" 
                           href="{% url 'dashboard' %}">
                           📊 Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'crear_transaccion' %}active fw-bold text-warning border-bottom border-warning{% endif %}" 
                           href="{% url 'crear_transaccion' %}">
                           💸 Nueva Transacción
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'lista_clientes' or request.resolver_match.url_name == 'crear_cliente' or request.resolver_match.url_name == 'editar_cliente' %}active fw-bold text-warning border-bottom border-warning{% endif %}" 
                           href="{% url 'lista_clientes' %}">
                           👥 Clientes
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        <!-- Contenido específico de cada página -->
        {% endblock %}
    </div>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
